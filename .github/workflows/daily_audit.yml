name: ZSP Autonomous Auditor

on:
  schedule:
    # Runs every day at 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows you to run it manually for demos

jobs:
  audit_job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to push changes back to the repo

      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          pip install anthropic sec-api requests

      - name: 4. Create Audit Directory
        run: mkdir -p audits

      - name: 5. Run Domain Agents (The Scouts)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
        run: |
          # These scouts pull the raw data
          python docket_scout.py
          python supply_chain_scout.py

      - name: 6. Run Sovereign Dispatcher (The Brain & Injector)
        # The 'continue-on-error' ensures the website updates even if AI credits are low
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sovereign_dispatcher.py

      - name: 7. Commit and Push Results
        run: |
          git config --global user.name "ZSP-Autonomous-Auditor"
          git config --global user.email "actions@github.com"
          git add audits/*.md
          git add index.html
          # Only commit if there are actual changes to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "ZSP Cycle Update: $(date +'%Y-%m-%d %H:%M')" && git push)
