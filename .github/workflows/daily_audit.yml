name: ZSP Autonomous Auditor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install anthropic sec-api
      - name: Prep
        run: mkdir -p audits
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python dispatcher.py
      - name: Save
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ZSP-Bot"
          git add audits/ || true
          git commit -m "ZSP Update" || exit 0
          git push
