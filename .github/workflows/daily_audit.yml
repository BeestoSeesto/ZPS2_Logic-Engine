name: ZSP Autonomous Auditor
on:
  schedule:
    - cron: '0 23 * * *' # 11 PM UTC Daily
  workflow_dispatch:      # Manual Trigger Button

env:
  # FIX: Silences the Node 20 deprecation warning by opting into Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic sec-api

      # FIX: Creates the folder so 'dispatcher.py' doesn't fail with Exit Code 1
      - name: Prepare Workspace
        run: mkdir -p audits

      - name: Execute ZSP Dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python dispatcher.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ZSP-Bot"
          git add audits/*.md
          # Prevents the job from failing if no new filings were found today
          git commit -m "ZSP Audit Update [$(date)]" || echo "No changes to commit"
          git push
