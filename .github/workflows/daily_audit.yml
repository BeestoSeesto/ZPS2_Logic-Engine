name: ZSP Autonomous Auditor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  audit_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: pip install anthropic sec-api

      - name: 4. Prepare Workspace
        run: |
          mkdir -p audits
          mkdir -p dispatches

      - name: 5. Run Domain Agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python dispatcher.py

      - name: 6. Run Sovereign Dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sovereign_dispatcher.py

      - name: 7. Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ZSP-Bot"
          git add audits/ || true
          git add dispatches/ || true
          git commit -m "ZSP Update: $(date)" || echo "No changes to commit"
          git push || echo "Push skipped"
