name: ZSP Autonomous Auditor
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

# Fix for the Node 20 Deprecation Warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use version 6 for Node 24 support in 2026
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic sec-api

      # FIX: Ensure the audits directory exists before the script runs
      - name: Prepare Workspace
        run: mkdir -p audits

      - name: Execute ZSP Dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python dispatcher.py

      - name: Commit and Push Audit Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ZSP-Bot"
          git add audits/*.md
          git commit -m "New ZSP Audit Log [$(date)]" || echo "No changes to commit"
          git push
