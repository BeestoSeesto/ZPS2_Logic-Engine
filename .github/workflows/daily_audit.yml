name: ZSP Autonomous Auditor
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

env:
  # This kills the Node 20 warning instantly
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        # Version 6 is the 2026 standard for Node 24 support
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic sec-api

      - name: 4. Debug & Prepare
        run: |
          echo "Checking for dispatcher.py..."
          ls -l dispatcher.py || (echo "ERROR: dispatcher.py not found in root!" && exit 1)
          mkdir -p audits
          echo "Workspace ready."

      - name: 5. Execute ZSP Dispatcher
        env:
          # Verify these names match exactly what you typed in Settings > Secrets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
        run: python dispatcher.py

      - name: 6. Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ZSP-Bot"
          git add audits/*.md
          git commit -m "ZSP Audit Update [$(date)]" || echo "No changes"
          git push
